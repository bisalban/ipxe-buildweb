name: Build iPXE PXE files

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build iPXE binaries
        run: |
          sudo apt update
          sudo apt install -y git build-essential binutils perl mtools syslinux isolinux genisoimage liblzma-dev liblzma5
          git clone https://github.com/ipxe/ipxe.git
          cd ipxe/src
          make bin/undionly.kpxe EMBED=../../embed.ipxe || true
          make bin/ipxe.pxe EMBED=../../embed.ipxe || true
          make bin/gpxe.pxe EMBED=../../embed.ipxe || true
          mkdir -p /home/runner/work/ipxe-buildweb/output
          cp bin/*.pxe /home/runner/work/ipxe-buildweb/output/

      - name: Upload build results
        uses: actions/upload-artifact@v3
        with:
          name: ipxe-binaries
          path: /home/runner/work/ipxe-buildweb/output/
