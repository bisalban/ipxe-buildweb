name: Build full iPXE PXE set

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential binutils perl mtools syslinux isolinux genisoimage liblzma-dev liblzma5 wget

      - name: Build iPXE binaries
        run: |
          git clone https://github.com/ipxe/ipxe.git
          cd ipxe/src
          set +e
          make bin/undionly.kpxe || true
          make bin/gpxe.pxe || true
          make bin/ipxe.pxe || true
          set -e
          mkdir -p ${{ github.workspace }}/output
          cp bin/*.pxe ${{ github.workspace }}/output/ || true

      - name: Upload PXE binaries
        uses: actions/upload-artifact@v4
        with:
          name: ipxe-binaries
          path: ${{ github.workspace }}/output/
